name: Zalo Fun Tests
on:
  pull_request:
    paths: ['zalo-fun/**', '.github/workflows/zalo-fun-tests.yml']
  push:
    paths: ['zalo-fun/**', '.github/workflows/zalo-fun-tests.yml']
permissions:
  contents: read
jobs:
  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test zalo-fun/worker.test.mjs
