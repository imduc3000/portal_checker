name: Tests
on:
  pull_request:
  push:
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
